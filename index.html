<script>
/* 讓「哈囉～這裡是潔諾！」和「目前有8年接案經歷…」各佔一行:放不下時自動縮小字級;
   縮到 12px 還是放不下(例如手機上的英文版),才允許換行 */
(function(){
  var MIN_PX=12;
  function fit(){
    var box=document.querySelector('.hero-text'),wrap=document.querySelector('.hero2');
    if(!box||!wrap)return;
    var wcs=getComputedStyle(wrap);
    var avail=wrap.getBoundingClientRect().right-parseFloat(wcs.paddingRight||0)-box.getBoundingClientRect().left;
    if(avail<=0)return;
    [].forEach.call(box.querySelectorAll('h1,.lead'),function(e){
      e.style.fontSize='';e.style.whiteSpace='';
      var fs=parseFloat(getComputedStyle(e).fontSize);
      var disp=e.style.display;e.style.display='inline-block';
      var nat=e.getBoundingClientRect().width;
      e.style.display=disp;
      if(nat<=avail)return;
      var next=fs*avail/nat*0.98;
      if(next<MIN_PX){e.style.fontSize=MIN_PX+'px';e.style.whiteSpace='normal';}
      else e.style.fontSize=next+'px';
    });
  }
  var t;function later(){clearTimeout(t);t=setTimeout(fit,60);}
  window.addEventListener('resize',later);
  window.addEventListener('load',fit);
  document.addEventListener('jess-lang-change',later);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
  fit();
})();
</script>
<script>
(function(){
  var FOLDERS=['illust','qq'];
  var track=document.getElementById('track'),sec=track.closest('.marquee-sec');

  Promise.all(FOLDERS.map(function(f){return JessGallery.findImages('images/works/'+f);})).then(function(lists){
    var list=[],max=0,k;
    lists.forEach(function(l){if(l.length>max)max=l.length;});
    for(k=0;k<max;k++)lists.forEach(function(l){if(k<l.length)list.push(l[k]);});
    if(!list.length){sec.hidden=true;return;}

    function shot(item,i,hidden){
      var d=document.createElement('div');d.className='shot-big';
      d.style.setProperty('--ar',item.w+'/'+item.h);
      if(hidden)d.setAttribute('aria-hidden','true');
      var im=document.createElement('img');im.alt=hidden?'':'作品 '+(i+1);
      im.decoding='async';
      im.onerror=function(){im.onerror=null;if(im.src.indexOf(item.src)<0)im.src=item.src;}; /* 縮圖不見時退回原圖 */
      im.src=item.thumb||item.src;
      d.appendChild(im);return d;
    }

    var h=(window.innerWidth<=600?240:340);
    var one=list.reduce(function(w,it){return w+h*it.w/it.h+20+3;},0);
    var reps=Math.max(1,Math.ceil(window.innerWidth/one));
    var group=[];for(k=0;k<reps;k++)group=group.concat(list);
    group.forEach(function(it,i){track.appendChild(shot(it,i,false));});
    group.forEach(function(it,i){track.appendChild(shot(it,i,true));});
  });
})();
</script>
