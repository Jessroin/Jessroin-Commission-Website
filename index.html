<script src="gallery.js"></script>
<script>
(function(){
  var FOLDERS=['illust','qq'];
  var track=document.getElementById('track'),sec=track.closest('.marquee-sec');

  Promise.all(FOLDERS.map(function(f){return JessGallery.findImages('images/works/'+f);})).then(function(lists){
    var list=[],max=0,k;
    lists.forEach(function(l){if(l.length>max)max=l.length;});
    for(k=0;k<max;k++)lists.forEach(function(l){if(k<l.length)list.push(l[k]);});
    if(!list.length){sec.hidden=true;return;}

    function shot(item,i,hidden){
      var d=document.createElement('div');d.className='shot-big';
      d.style.setProperty('--ar',item.w+'/'+item.h);
      if(hidden)d.setAttribute('aria-hidden','true');
      var im=document.createElement('img');im.src=item.src;im.alt=hidden?'':'作品 '+(i+1);
      im.decoding='async';
      d.appendChild(im);return d;
    }

    var h=(window.innerWidth<=600?240:340);
    var one=list.reduce(function(w,it){return w+h*it.w/it.h+20+3;},0);
    var reps=Math.max(1,Math.ceil(window.innerWidth/one));
    var group=[];for(k=0;k<reps;k++)group=group.concat(list);
    group.forEach(function(it,i){track.appendChild(shot(it,i,false));});
    group.forEach(function(it,i){track.appendChild(shot(it,i,true));});
  });
})();
</script>
